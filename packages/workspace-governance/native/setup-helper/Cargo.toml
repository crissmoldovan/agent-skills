[package]
name = "workspace-governance-setup-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"
publish = false
license = "MIT"
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "workspacectl-setup-askpass"
path = "src/askpass.rs"

[[bin]]
name = "workspacectl-init-helper"
path = "src/init_helper.rs"

[[bin]]
name = "workspacectl-init-trial-controller"
path = "src/init_trial_controller.rs"

[dependencies]
libc = "=0.2.171"
ryu-js = "=1.0.2"
sha2 = "=0.10.8"
base64 = "=0.22.1"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
