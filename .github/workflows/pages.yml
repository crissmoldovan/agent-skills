# The site is generated, so it is built on the runner from the skills themselves
# and never committed: a checked-in copy would be a second answer to what the
# pack contains, and the two would drift.
name: Publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run publishes the newer commit rather than racing the older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The generator's own tests: every skill present, each description and ask
      # taken from the skill itself, and the page's script parsing.
      - run: node --test test/site-build.test.mjs
      - run: npm run site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
